<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#10142a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stenhagen">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <title>Spring i Stenhagen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; background: #10142a; overflow: hidden;
      touch-action: none; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }

    #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
    #touch.on { display: block; }
    #touch button {
      position: absolute; pointer-events: auto; touch-action: none;
      font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff;
      background: rgba(0, 0, 0, 0.3); border: 3px solid rgba(255, 255, 255, 0.65); border-radius: 16px;
    }
    #touch button:active { background: rgba(255, 225, 77, 0.45); }
    #btnUp, #btnDown { font-family: system-ui, sans-serif !important; font-size: 26px !important; }
    #btnUp   { left: calc(12px + env(safe-area-inset-left)); bottom: calc(96px + env(safe-area-inset-bottom)); width: 72px; height: 72px; }
    #btnDown { left: calc(12px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 72px; height: 72px; }
    #touch #btnJump {
      right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
      width: 104px; height: 104px; border-radius: 50%; font-size: 12px;
    }
    #btnPause { right: calc(12px + env(safe-area-inset-right)); top: calc(12px + env(safe-area-inset-top)); width: 46px; height: 46px; font-size: 10px; }

    /* Spelet är byggt för liggande skärm */
    #rotate {
      position: fixed; inset: 0; display: none; z-index: 10;
      align-items: center; justify-content: center; flex-direction: column; gap: 24px;
      background: #10142a; color: #fff; text-align: center; padding: 24px;
      font-family: 'Press Start 2P', monospace; font-size: 14px; line-height: 1.8;
    }
    #rotate .phone {
      width: 48px; height: 80px; border: 4px solid #ffe14d; border-radius: 10px;
      animation: turn 2s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch">
    <button id="btnUp" aria-label="Trottoaren">▲</button>
    <button id="btnDown" aria-label="Gatan">▼</button>
    <button id="btnJump">HOPPA</button>
    <button id="btnPause" aria-label="Paus">II</button>
  </div>
  <div id="rotate">
    <div class="phone"></div>
    <div>Vrid telefonen<br>för att spela!</div>
  </div>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
